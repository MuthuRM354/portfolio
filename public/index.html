<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Modern Portfolio Website with Neon Theme - Cyberpunk inspired design showcasing skills, projects, and experience." />
    
    <!-- SEO Meta Tags -->
    <meta name="keywords" content="portfolio, developer, neon, cyberpunk, react, web developer, frontend, backend, full stack" />
    <meta name="author" content="Your Name" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Modern Portfolio - Neon Theme" />
    <meta property="og:description" content="Cyberpunk inspired portfolio showcasing modern web development skills" />
    <meta property="og:type" content="website" />
    
    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <title>Muthu Manikandan - Portfolio</title>
    
    <style>
        /* Critical CSS for initial load */
        body {
            margin: 0;
            font-family: 'VT323', 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        #root {
            min-height: 100vh;
        }
        
        /* Loading spinner */
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 255, 0.3);
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 9999;
        }
        
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
        <!-- Loading spinner for initial load -->
        <div class="loading-spinner"></div>
    </div>
</body>
</html>
